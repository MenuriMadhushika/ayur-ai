services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ayurai_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes: ["ayurai_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
  ai-service:
    build: ./ai-service
    restart: unless-stopped
    ports: ["8000:8000"]
  backend:
    build: ./backend/ayurai-backend
    restart: unless-stopped
    depends_on:
      database: { condition: service_healthy }
      ai-service: { condition: service_started }
    environment:
      DB_URL: jdbc:mysql://database:3306/ayurai_db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SKIN_MODEL_URL: http://ai-service:8000
    ports: ["8081:8081"]
  frontend:
    build:
      context: .
      args: { VITE_API_BASE_URL: "http://localhost:8081/api" }
    depends_on: [backend]
    ports: ["5173:80"]
volumes:
  ayurai_mysql:
